<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Running — Porto Marathon</title>
  <meta name="description" content="Coach running personnel — préparation Marathon de Porto 2026.">
  <meta name="theme-color" content="#243127">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coach Running">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23E8521A'/%3E%3Cpath d='M4 17c3.5-1.6 6.2-1.5 8.1.3 1.9 1.8 4.5 1.9 7.9.3M7 13l2.5-4.6 4.2 1.2L17 6M10 8.4l2.2 4.5-2 3.6M14 9.7l2.4 4.8' fill='none' stroke='white' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #161514;
      --muted: #77736D;
      --soft: #F6F2EC;
      --surface: rgba(255,255,255,0.86);
      --line: rgba(28,24,20,0.09);
      --accent: #E8521A;
      --accent-dark: #A9350B;
      --track: #243127;
      --shadow-sm: 0 8px 22px rgba(26,24,20,0.07);
      --shadow-md: 0 18px 42px rgba(26,24,20,0.11);
      --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 20% -10%, rgba(232,82,26,0.18), transparent 34%),
        linear-gradient(180deg, #FBF7F1 0%, #F3F5F0 46%, #EEF2ED 100%);
      color: var(--ink);
      font-size: 14px;
      min-height: 100vh;
    }

    /* HEADER */
    #header {
      background:
        linear-gradient(135deg, rgba(36,49,39,0.98) 0%, rgba(63,55,44,0.96) 54%, rgba(168,53,11,0.95) 100%);
      color: white;
      padding: 20px 16px 15px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 38px rgba(36,49,39,0.18);
    }
    #header::after {
      content: "";
      position: absolute; inset: auto -30px -80px auto;
      width: 190px; height: 190px; border-radius: 50%;
      border: 28px solid rgba(255,255,255,0.055);
      pointer-events: none;
    }
    .hdr-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand-row { display: flex; align-items: center; gap: 9px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 11px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
    }
    .brand-mark svg, .svg-icon { width: 18px; height: 18px; display: block; }
    .hdr-title { font-size: 19px; font-weight: 850; letter-spacing: -0.2px; }
    .hdr-sub { font-size: 12px; opacity: 0.85; margin-top: 2px; }
    .countdown {
      background: rgba(255,255,255,0.14); border-radius: 12px; padding: 8px 12px;
      text-align: center; min-width: 72px; backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.13);
    }
    .countdown-num { font-size: 30px; font-weight: 900; line-height: 1; }
    .countdown-lbl { font-size: 10px; opacity: 0.85; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .hdr-chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .chip {
      background: rgba(255,255,255,0.12); border-radius: 999px; padding: 5px 10px;
      font-size: 11px; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(255,255,255,0.09);
    }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; background: #FFB86A; }
    .next-bar {
      background: rgba(255,255,255,0.12);
      border-radius: 13px; padding: 10px 12px; margin-top: 11px;
      display: flex; align-items: center; gap: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
    }
    .next-bar-icon {
      width: 34px; height: 34px; border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.12); color: white; flex-shrink: 0;
    }
    .next-lbl { font-size: 10px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.5px; }
    .next-name { font-size: 13px; font-weight: 700; margin-top: 1px; }
    .next-detail { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    /* TABS */
    .tabs {
      display: flex; background: rgba(255,255,255,0.84);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10;
      overflow-x: auto;
      backdrop-filter: blur(18px);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 12px 14px; font-size: 12px; font-weight: 650;
      font-family: inherit; background: none; border: none;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.22s var(--ease), background 0.22s var(--ease), border-color 0.22s var(--ease);
      white-space: nowrap; flex-shrink: 0;
    }
    .tab:hover { color: var(--ink); background: rgba(232,82,26,0.05); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 800; }

    /* CONTENT */
    .content { padding: 15px 14px 28px; }
    .content > * { animation: liftIn 0.34s var(--ease) both; }
    .content > *:nth-child(2) { animation-delay: 0.03s; }
    .content > *:nth-child(3) { animation-delay: 0.06s; }
    .section-title { font-size: 15px; font-weight: 820; margin-bottom: 12px; color: var(--ink); letter-spacing: -0.1px; }

    /* DASHBOARD */
    .dash-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .dash-hero {
      position: relative; overflow: hidden; border-radius: 18px; padding: 16px;
      background: linear-gradient(145deg, rgba(36,49,39,0.98), rgba(70,63,50,0.96) 56%, rgba(232,82,26,0.88));
      color: white; box-shadow: 0 24px 54px rgba(36,49,39,0.22);
    }
    .dash-hero::before {
      content: ""; position: absolute; width: 220px; height: 220px; right: -92px; top: -88px;
      border-radius: 50%; border: 34px solid rgba(255,255,255,0.055);
    }
    .dash-hero-top { position: relative; display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .dash-kicker {
      font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: 0.55px;
      color: rgba(255,255,255,0.68); margin-bottom: 6px;
    }
    .dash-title { font-size: 23px; line-height: 1.05; font-weight: 900; letter-spacing: -0.5px; max-width: 220px; }
    .dash-sub { margin-top: 7px; font-size: 12px; line-height: 1.45; color: rgba(255,255,255,0.78); max-width: 250px; }
    .readiness-ring {
      --score: 75; width: 86px; height: 86px; border-radius: 50%; flex-shrink: 0;
      position: relative;
      display: grid; place-items: center;
      background: conic-gradient(#8ED1A4 calc(var(--score)*1%), rgba(255,255,255,0.14) 0);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 12px 28px rgba(0,0,0,0.18);
    }
    .readiness-ring::before {
      content: ""; position: absolute; width: 62px; height: 62px; border-radius: 50%;
      background: rgba(36,49,39,0.92); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .readiness-value { position: relative; font-size: 23px; font-weight: 950; letter-spacing: -0.7px; }
    .readiness-label { position: relative; margin-top: -2px; font-size: 9px; color: rgba(255,255,255,0.64); text-transform: uppercase; font-weight: 800; }
    .dash-hero-metrics { position: relative; display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 16px; }
    .hero-metric {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px;
      padding: 9px 8px; backdrop-filter: blur(12px);
    }
    .hero-metric-val { font-size: 16px; font-weight: 900; }
    .hero-metric-lbl { margin-top: 2px; font-size: 9px; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.3px; }
    .coach-card, .focus-card, .load-card, .strategy-card, .lab-card, .profile-card {
      background: var(--surface); border: 1px solid rgba(255,255,255,0.76); border-radius: 15px;
      box-shadow: var(--shadow-sm); padding: 14px;
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 860; }
    .card-title .svg-icon { width: 17px; height: 17px; color: var(--accent); }
    .status-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: 0.25px;
    }
    .coach-copy { font-size: 13px; color: #444; line-height: 1.55; }
    .decision-list { display: grid; gap: 8px; }
    .decision-item {
      display: grid; grid-template-columns: 4px 1fr; gap: 9px; align-items: stretch;
      padding: 9px; border-radius: 12px; background: rgba(255,255,255,0.62);
      border: 1px solid rgba(28,24,20,0.06);
    }
    .decision-rail { border-radius: 999px; background: var(--accent); }
    .decision-title { font-size: 12px; font-weight: 850; color: var(--ink); }
    .decision-copy { margin-top: 2px; font-size: 11px; color: #666; line-height: 1.45; }
    .feeling-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 12px; }
    .feel-btn {
      border: 1px solid var(--line); background: rgba(255,255,255,0.76); border-radius: 10px;
      padding: 8px 4px; font-size: 11px; color: #555; font-weight: 750; cursor: pointer;
      transition: transform 0.2s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease), color 0.2s var(--ease);
    }
    .feel-btn:hover { transform: translateY(-1px); border-color: rgba(232,82,26,0.32); }
    .feel-btn.active { color: var(--accent); border-color: rgba(232,82,26,0.42); background: #FFF7ED; }
    .focus-main { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 11px; }
    .focus-icon {
      width: 44px; height: 44px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--accent); background: #FFF7ED;
    }
    .focus-icon svg { width: 21px; height: 21px; }
    .focus-name { font-size: 14px; font-weight: 880; }
    .focus-detail { margin-top: 2px; font-size: 11px; color: #777; line-height: 1.35; }
    .focus-km { text-align: right; font-size: 17px; font-weight: 950; color: var(--accent); white-space: nowrap; }
    .focus-pace { font-size: 10px; color: #999; font-weight: 650; }
    .load-bars { display: grid; gap: 9px; }
    .load-row { display: grid; grid-template-columns: 78px 1fr 44px; gap: 8px; align-items: center; font-size: 11px; color: #666; }
    .load-track { height: 8px; border-radius: 999px; background: rgba(28,24,20,0.07); overflow: hidden; }
    .load-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg,#8ED1A4,var(--accent)); transform-origin: left; animation: growBar 0.62s var(--ease) both; }
    .race-card {
      border-radius: 16px; padding: 14px; color: white;
      background:
        linear-gradient(135deg, rgba(15,118,110,0.96), rgba(36,49,39,0.98) 58%, rgba(232,82,26,0.82));
      box-shadow: 0 22px 46px rgba(15,118,110,0.16);
      overflow: hidden; position: relative;
    }
    .race-card::after {
      content: ""; position: absolute; right: -64px; bottom: -90px; width: 190px; height: 190px;
      border-radius: 50%; border: 28px solid rgba(255,255,255,0.055);
      pointer-events: none;
    }
    .race-card > * { position: relative; z-index: 1; }
    .target-row { display: grid; grid-template-columns: 38px 1fr 38px; gap: 8px; align-items: center; margin-top: 10px; }
    .target-btn {
      border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.12); color: white;
      border-radius: 11px; height: 38px; font-size: 18px; font-weight: 850; cursor: pointer;
    }
    .target-time { text-align: center; font-size: 30px; font-weight: 950; letter-spacing: -0.8px; }
    .race-forecast {
      margin-top: 10px; padding: 10px; border-radius: 13px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.1);
    }
    .forecast-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .forecast-label { font-size: 9px; color: rgba(255,255,255,0.66); text-transform: uppercase; letter-spacing: 0.35px; font-weight: 850; }
    .forecast-time { margin-top: 2px; font-size: 24px; font-weight: 950; letter-spacing: -0.6px; }
    .forecast-delta { font-size: 11px; font-weight: 850; padding: 4px 7px; border-radius: 999px; background: rgba(255,255,255,0.13); white-space: nowrap; }
    .forecast-copy { margin-top: 7px; font-size: 11px; line-height: 1.42; color: rgba(255,255,255,0.72); }
    .race-splits { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 11px; }
    .race-split { background: rgba(255,255,255,0.11); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; padding: 8px; }
    .race-split-val { font-size: 14px; font-weight: 900; }
    .race-split-lbl { margin-top: 2px; font-size: 9px; color: rgba(255,255,255,0.66); text-transform: uppercase; letter-spacing: 0.3px; }
    .strategy-list { display: grid; gap: 8px; }
    .strategy-item { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .strategy-icon {
      width: 31px; height: 31px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
      background: #F0FDFA; color: #0F766E; flex-shrink: 0;
    }
    .strategy-icon svg { width: 16px; height: 16px; }
    .strategy-name { font-size: 12px; font-weight: 820; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .strategy-meta { font-size: 10px; color: #888; margin-top: 1px; }
    .premium-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ghost-action {
      border: 1px solid var(--line); background: rgba(255,255,255,0.72); color: var(--ink);
      border-radius: 11px; padding: 10px 8px; font-size: 12px; font-weight: 820; cursor: pointer;
      transition: transform 0.2s var(--ease), background 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .ghost-action:hover { transform: translateY(-1px); background: white; border-color: rgba(232,82,26,0.28); }
    .profile-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .profile-stat {
      background: rgba(36,49,39,0.045); border: 1px solid rgba(28,24,20,0.05);
      border-radius: 11px; padding: 9px;
    }
    .profile-val { font-size: 15px; font-weight: 900; color: var(--ink); }
    .profile-lbl { margin-top: 2px; font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 800; }
    .profile-note { margin-top: 10px; font-size: 12px; line-height: 1.45; color: #666; }
    .sync-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-top: 10px; }
    .sync-status { font-size: 11px; color: #777; line-height: 1.35; }
    .mini-action {
      border: 0; border-radius: 10px; padding: 9px 10px; color: white;
      background: linear-gradient(135deg,var(--accent),var(--accent-dark));
      font-size: 11px; font-weight: 850; cursor: pointer; white-space: nowrap;
    }
    .mini-action[disabled] { opacity: 0.55; cursor: default; }
    .sesh-real { margin-top: 3px; font-size: 10px; font-weight: 750; color: #0F766E; }

    /* TOAST */
    #toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px);
      z-index: 80; max-width: min(92vw, 480px);
      background: rgba(22,21,20,0.94); color: white; border-radius: 12px;
      padding: 11px 16px; font-size: 12.5px; line-height: 1.45;
      box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
      transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    #toast.error { background: rgba(146,33,18,0.96); }
    #toast a { color: #FFD0B5; }

    /* REPROGRAMMATION SÉANCE */
    .reprogram { margin-top: 12px; padding: 12px; border-radius: 13px; background: rgba(36,49,39,0.045); border: 1px solid rgba(28,24,20,0.06); }
    .reprogram-label { font-size: 11px; font-weight: 800; color: #555; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 8px; }
    .day-picker { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
    .day-pick {
      border: 1px solid var(--line); background: rgba(255,255,255,0.78); color: #555;
      border-radius: 9px; padding: 9px 0; font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit;
      transition: transform 0.15s var(--ease), border-color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .day-pick:hover { transform: translateY(-1px); border-color: rgba(232,82,26,0.4); }
    .day-pick.active { background: var(--accent); color: white; border-color: var(--accent); }
    .reprogram-reset {
      margin-top: 9px; width: 100%; border: 1px dashed rgba(28,24,20,0.18); background: none; color: #777;
      border-radius: 9px; padding: 8px; font-size: 11px; font-weight: 750; cursor: pointer; font-family: inherit;
    }
    .moved-tag { display: inline-block; margin-left: 6px; color: var(--accent); font-weight: 900; }

    /* COACH ADAPTATIF (raison → alternative) */
    .coach-adapt { margin-top: 12px; padding: 12px; border-radius: 13px; background: #F0F9FF; border: 1px solid rgba(2,132,199,0.12); }
    .coach-adapt .reprogram-label { color: #0369A1; display: flex; align-items: center; gap: 6px; }
    .coach-adapt .reprogram-label .svg-icon { width: 15px; height: 15px; }
    .reason-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .zone-grid { margin-top: 6px; }
    .reason-btn {
      border: 1px solid rgba(2,132,199,0.18); background: rgba(255,255,255,0.85); color: #0F557E;
      border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 750; cursor: pointer; font-family: inherit;
      transition: transform 0.15s var(--ease), border-color 0.15s var(--ease), background 0.15s var(--ease);
    }
    .reason-btn:hover { transform: translateY(-1px); }
    .reason-btn.active { background: #0284C7; color: white; border-color: #0284C7; }
    .adapt-card { margin-top: 10px; background: rgba(255,255,255,0.9); border: 1px solid rgba(2,132,199,0.1); border-radius: 11px; padding: 11px; }
    .adapt-title { font-size: 12.5px; font-weight: 850; color: #0F557E; margin-bottom: 4px; }
    .adapt-copy { font-size: 12px; line-height: 1.5; color: #444; }
    .adapt-copy i { color: #92400E; font-style: italic; }
    .adapt-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .adapt-action {
      border: 1px solid var(--line); background: white; color: var(--ink);
      border-radius: 9px; padding: 10px; font-size: 12px; font-weight: 800; cursor: pointer; font-family: inherit;
      text-align: left; transition: transform 0.15s var(--ease), border-color 0.15s var(--ease);
    }
    .adapt-action:hover { transform: translateY(-1px); border-color: rgba(2,132,199,0.45); }
    .focus-hint { font-size: 11px; color: #888; margin: 2px 0 6px; }

    /* RENFORCEMENT */
    .strength-intro { font-size: 12px; color: #666; line-height: 1.5; margin-bottom: 12px; }
    .strength-form { margin-bottom: 14px; }
    .strength-card .act-name { display: flex; align-items: center; gap: 6px; }
    .strength-card .act-name .svg-icon { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
    .focus-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .focus-chip {
      border: 1px solid var(--line); background: rgba(255,255,255,0.78); color: #666;
      border-radius: 999px; padding: 6px 11px; font-size: 11px; font-weight: 750; cursor: pointer; font-family: inherit;
      transition: transform 0.15s var(--ease), border-color 0.15s var(--ease);
    }
    .focus-chip:hover { transform: translateY(-1px); border-color: rgba(232,82,26,0.35); }
    .focus-chip.active { font-weight: 850; }
    .strength-del {
      margin-top: 9px; border: 0; background: rgba(220,38,38,0.08); color: #DC2626;
      border-radius: 8px; padding: 7px 12px; font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit;
    }

    /* CETTE SEMAINE */
    .phase-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 700; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.4px;
      box-shadow: var(--shadow-sm);
    }

    .act-date { font-size: 11px; color: #888; margin-top: 2px; }

      display: flex; align-items: center; justify-content: center;
      padding: 40px; color: #AAA; gap: 10px; font-size: 13px;

    .close-btn {

      border-radius: 15px; padding: 13px; color: white;

    .session-hero-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 11px; }
    .session-stat { background: rgba(255,255,255,0.12); border-radius: 11px; padding: 8px; border: 1px solid rgba(255,255,255,0.08); }
    .session-stat-val { font-size: 15px; font-weight: 900; }
    .session-stat-lbl { font-size: 9px; color: rgba(255,255,255,0.68); text-transform: uppercase; margin-top: 2px; }
    .session-blocks { display: grid; gap: 8px; margin-top: 10px; }
    .session-block {
      display: grid; grid-template-columns: 28px 1fr; gap: 9px; padding: 10px;
      border-radius: 13px; background: var(--surface); border: 1px solid rgba(255,255,255,0.76);
      box-shadow: var(--shadow-sm);
    }
    .block-num {
      width: 28px; height: 28px; border-radius: 9px; background: #FFF7ED; color: var(--accent);
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900;
    }
    .block-title { font-size: 12px; font-weight: 850; }
    .block-copy { margin-top: 2px; font-size: 11px; color: #666; line-height: 1.45; }
    .session-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .log-actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-top: 10px; }
    .log-btn {
      border: 1px solid var(--line); background: rgba(255,255,255,0.76); border-radius: 10px;

    .primary-action {

      background: linear-gradient(135deg,var(--accent),var(--accent-dark)); box-shadow: 0 12px 24px rgba(232,82,26,0.2);
      cursor: pointer;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheetIn { from { transform: translateY(18px); } to { transform: translateY(0); } }
    @keyframes liftIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>

const MS_WEEK = 7 * 24 * 3600 * 1000;
const STORE_KEY    = 'coach-running-premium-state';
const TOKEN_KEY    = 'strava-tokens';
const STRAVA_CLIENT_ID = '217744';

  name:'Nathan',
  age:33,
  weight:87,
  experience:'intermédiaire',
  availableDays:'mar, jeu, sam, dim',
  preferredTerrain:'route + trail vallonné',
  injuryWatch:'mollets / fatigue post-trail',
  easyPace:'6:30-7:00',
  marathonGoal:'Porto 2026 · performance maîtrisée',
};

function weekIndex(date) {
  return Math.max(0, Math.min(21, Math.floor((date - PLAN_START) / MS_WEEK)));
}

function weekStart(idx) {
  return new Date(PLAN_START.getTime() + idx * MS_WEEK);
}

function dayOfWeek(date) {
  const d = date.getDay();
  return d === 0 ? 6 : d - 1; // Mon=0 … Sun=6
}

function fmtPace(speed) {
  if (!speed || speed <= 0) return '—';
  const spk = 1000 / speed;
  return `${Math.floor(spk/60)}:${String(Math.round(spk%60)).padStart(2,'0')}/km`;
}

function fmtDist(m) { return (m/1000).toFixed(1)+' km'; }
function fmtTime(s) {
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : `${m}min`;
}
function fmtDate(str) {
  const d = new Date(str);
  return d.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
}

function iconSvg(name, cls = 'svg-icon') {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.event}</svg>`;
}

function fmtEventDate(dateStr) {
  const d = parseLocalDate(dateStr);
  return d.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
}

function parseLocalDate(dateStr) {
  return new Date(`${dateStr}T00:00:00`);
}

function dateKey(date) {
  return date.toISOString().slice(0, 10);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[ch]));
}

function eventTypeLabel(type) {
  return type === 'trail' ? 'Trail' : 'Route';
}

function priorityStyle(priority) {
  return {
    A: { color:'#DC2626', bg:'#FEF2F2', label:'Objectif majeur' },
    B: { color:'#D97706', bg:'#FFFBEB', label:'Objectif secondaire' },
    C: { color:'#2563EB', bg:'#EFF6FF', label:'Préparation' },
  }[priority] || { color:'#6B7280', bg:'#F3F4F6', label:'Préparation' };
}

function cleanNote(note) {
  return String(note || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
}

function eventsForWeek(idx) {
  const ws = weekStart(idx);
  const we = new Date(ws.getTime() + 6 * 86400000);
  return EVENTS.filter(ev => {
    const d = parseLocalDate(ev.date);
    return d >= ws && d <= we;
  }).sort((a,b) => a.date.localeCompare(b.date));
}

function eventSnippet(events) {
  return events.map(ev => {
    const ps = priorityStyle(ev.priority);
    return `
      <div class="sesh-event">
        <span class="priority-badge" style="width:18px;height:18px;font-size:9px;background:${ps.color}">${ev.priority}</span>
        ${iconSvg('event')}
        <strong>${escapeHtml(ev.name)}</strong>
        <span>${ev.distance} km · ${eventTypeLabel(ev.type)}</span>
      </div>`;
  }).join('');
}

// Séances effectives d'une semaine = plan + déplacements utilisateur.
// Chaque séance garde origDay (clé stable des logs) et un drapeau moved.
function weekSessions(wi) {
  const week = PLAN[wi];
  if (!week) return [];
  return week.sessions
    .map(s => {
      const moved = sessionMoves[`${wi}-${s.day}`];
      const day = Number.isInteger(moved) ? moved : s.day;
      return { ...s, day, origDay: s.day, moved: Number.isInteger(moved) && moved !== s.day };
    })
    .sort((a, b) => a.day - b.day);
}

function nextSession(wi, dow) {
  for (let w = wi; w < PLAN.length; w++) {
    for (const s of weekSessions(w)) {
      if (w === wi && s.day <= dow) continue;
      if (s.type === 'rest') continue;
      return { wi: w, s };
    }
  }
  return null;
}

// Déplace une séance vers un autre jour de la même semaine.
// Si le jour cible est déjà occupé, on échange les deux (1 séance/jour garanti).
function moveSession(wi, origDay, targetDay) {
  const sessions = weekSessions(wi);
  const moving = sessions.find(s => s.origDay === origDay);
  if (!moving || targetDay === moving.day) { closeSessionDetail(); return; }
  const occupant = sessions.find(s => s.day === targetDay && s.origDay !== origDay);
  const setDay = (oDay, d) => {
    const key = `${wi}-${oDay}`;
    if (d === oDay) delete sessionMoves[key];
    else sessionMoves[key] = d;
  };
  const fromDay = moving.day;
  setDay(origDay, targetDay);
  if (occupant) setDay(occupant.origDay, fromDay); // échange
  saveAppState();
  closeSessionDetail();
  rerenderCurrentTab();
  showToast(occupant
    ? `Séances permutées : ${DAYS_FR[targetDay]} ↔ ${DAYS_FR[fromDay]}.`
    : `Séance déplacée à ${DAYS_FULL[targetDay].toLowerCase()}.`);
}

function resetSessionMove(wi, origDay) {
  delete sessionMoves[`${wi}-${origDay}`];
  saveAppState();
  closeSessionDetail();
  rerenderCurrentTab();
  showToast('Séance remise à son jour initial.');
}

// ─────────────────────────────────────────────────────────────
// GESTION AUTH STRAVA (tokens localStorage)
// ─────────────────────────────────────────────────────────────
function getStoredTokens() {
  try { return JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch { return null; }
}
function saveTokens(t) {
  localStorage.setItem(TOKEN_KEY, JSON.stringify(t));
}
function getAccessToken() {
  return getStoredTokens()?.access_token || null;
}
function isStravaConnected() {
  return !!getAccessToken();
}

async function ensureValidToken() {
  const t = getStoredTokens();
  if (!t) throw new Error('Non connecté à Strava');
  const now = Math.floor(Date.now() / 1000);
  if (t.expires_at > now + 60) return t.access_token;
  // Token expiré → refresh via la fonction serverless
  const r = await fetch('/api/refresh', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: t.refresh_token }),
  });
  const data = await r.json();
  if (!data.access_token) {
    // Refresh token révoqué côté Strava → on repart sur une connexion propre
    if (r.status === 401) localStorage.removeItem(TOKEN_KEY);
    throw new Error('Reconnexion Strava nécessaire');
  }
  saveTokens({ access_token: data.access_token, refresh_token: data.refresh_token || t.refresh_token, expires_at: data.expires_at });
  return data.access_token;
}

// Domaine canonique de prod : l'OAuth Strava passe toujours par lui, même si
// l'app est ouverte via une URL de preview Vercel → une seule valeur à déclarer
// comme Authorization Callback Domain côté Strava.
let canonicalHostCache = null;
async function getCanonicalHost() {
  if (canonicalHostCache) return canonicalHostCache;
  try {
    const r = await fetch('/api/config');
    const data = await r.json();
    canonicalHostCache = String(data.canonical_host || '').trim() || window.location.hostname;
  } catch {
    canonicalHostCache = window.location.hostname;
  }
  return canonicalHostCache;
}

async function fillCanonicalHost() {
  const host = await getCanonicalHost();
  document.querySelectorAll('.cb-domain').forEach(el => el.textContent = host);
}

async function connectStrava() {
  const host = await getCanonicalHost();
  const proto = /^(localhost|127\.)/.test(host) ? 'http' : 'https';
  const params = new URLSearchParams({
    client_id:      STRAVA_CLIENT_ID,
    redirect_uri:   `${proto}://${host}/api/callback`,
    response_type:  'code',
    approval_prompt:'auto',
    scope:          'activity:read_all',
  });
  window.location.href = `https://www.strava.com/oauth/authorize?${params}`;
}

function disconnectStrava() {
  localStorage.removeItem(TOKEN_KEY);
  cache = null; stravaHistory = []; stravaSyncedAt = null;
  saveAppState();
  rerenderCurrentTab();
  showToast('Compte Strava déconnecté.');
}

const AUTH_ERROR_MESSAGES = {
  access_denied: 'Connexion Strava annulée.',
  no_code: 'Connexion Strava incomplète — aucun code reçu, réessaie.',
  token_exchange_failed: 'Strava a refusé l’échange de tokens. Vérifie STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET côté Vercel.',
  missing_server_config: 'Variables STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET absentes côté Vercel : ajoute-les dans Settings → Environment Variables, puis redéploie.',
  server_error: 'Erreur serveur pendant la connexion Strava. Réessaie dans un instant.',
};

function handleOAuthCallback() {
  const query = new URLSearchParams(window.location.search);
  const hash  = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
  const src   = hash.has('access_token') ? hash : query;

  if (src.has('access_token')) {
    saveTokens({
      access_token:  src.get('access_token'),
      refresh_token: src.get('refresh_token'),
      expires_at:    parseInt(src.get('expires_at'), 10),
    });
    window.history.replaceState({}, document.title, window.location.pathname);
    showToast('Strava connecté — synchronisation en cours…');
  } else if (query.has('auth_error')) {
    const code = query.get('auth_error');
    const detail = query.get('auth_error_detail');
    console.error('Auth Strava error:', code, detail || '');
    window.history.replaceState({}, document.title, window.location.pathname);
    const base = AUTH_ERROR_MESSAGES[code] || `Connexion Strava échouée (${escapeHtml(code)}).`;
    showToast(base + (detail ? `<br>Détail Strava : <b>${escapeHtml(detail)}</b>` : ''), 'error', 12000);
  }
}

let toastTimer = null;
function showToast(message, type = 'info', duration = 4500) {
  const el = document.getElementById('toast');

  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

function saveAppState() {

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function kmBetween(start, end) {
  return trainingHistory().reduce((sum, a) => {
    const d = parseLocalDate(a.d);
    return d >= start && d <= end ? sum + a.km : sum;
  }, 0);
}

function trainingHistory() {
  const byKey = {};
  [...HISTORY, ...stravaHistory].forEach(a => {
    const key = `${a.d}-${Math.round(a.km * 100)}-${a.type}`;
    byKey[key] = a;
  });
  return Object.values(byKey).sort((a,b) => a.d.localeCompare(b.d));
}

function stravaToHistory(activities) {
  return (activities || [])
    .filter(a => ['Run','TrailRun'].includes(a.sport_type))
    .map(a => {
      // Format API directe : a.distance, a.average_speed, a.start_date_local
      const dist = a.distance || 0;
      const spd  = a.average_speed || 0;
      return {
        d:    String(a.start_date_local || a.start_local || '').slice(0, 10),
        km:   +(dist / 1000).toFixed(2),
        spd,
        type: a.sport_type === 'TrailRun' ? 'Trail' : 'Run',
        // workout_type 1 = course officielle → seules les vraies courses deviennent des jalons
        note: a.workout_type === 1 ? a.name : null,
        hr:   a.average_heartrate ? Math.round(a.average_heartrate) : null,
        id:   a.id,
      };
    })
    .filter(a => a.d && a.km > 0 && a.spd > 0);
}

// Séances de renforcement importées de Strava (muscu, workout, crossfit…)
const STRENGTH_SPORT_TYPES = ['WeightTraining','Workout','Crossfit','Elliptical','StairStepper'];
function stravaToStrength(activities) {
  return (activities || [])
    .filter(a => STRENGTH_SPORT_TYPES.includes(a.sport_type) || STRENGTH_SPORT_TYPES.includes(a.type))
    .map(a => ({
      id:     String(a.id),
      d:      String(a.start_date_local || a.start_local || '').slice(0, 10),
      name:   a.name || 'Renforcement',
      min:    Math.round((a.moving_time || a.elapsed_time || 0) / 60),
      hr:     a.average_heartrate ? Math.round(a.average_heartrate) : null,
      source: 'strava',
    }))
    .filter(a => a.d);
}

// Fusion Strava + ajouts manuels, focus appliqué, le plus récent d'abord
function allStrength() {
  const fromStrava = strengthHistory.map(s => ({ ...s, focus: strengthFocus[s.id] || s.focus || null }));
  const manual = manualStrength.map(s => ({ ...s, source: 'manual' }));
  const byId = {};
  [...fromStrava, ...manual].forEach(s => { byId[s.id] = s; });
  return Object.values(byId).sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
}

function strengthCount(days = 28) {
  const since = new Date(); since.setHours(0,0,0,0); since.setDate(since.getDate() - days + 1);
  const todayStr = new Date().toISOString().slice(0,10);

}

function setStrengthFocus(id, key) {

function deleteManualStrength(id) {

let syncInFlight = false;
async function syncStrava() {
  if (syncInFlight) return;
  const status = document.getElementById('sync-status');
  if (!isStravaConnected()) {
    if (status) status.innerHTML = `<button onclick="connectStrava()" style="background:#FC4C02;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600">Connecter Strava</button>`;
    return;
  }
  syncInFlight = true;
  document.querySelectorAll('.mini-action').forEach(b => b.disabled = true);
  if (status) status.textContent = 'Synchronisation Strava…';
  try {
    const token = await ensureValidToken();
    // Récupère les 80 dernières activités (couvre toute la saison)
    const r = await fetch(
      'https://www.strava.com/api/v3/athlete/activities?per_page=80',
      { headers: { 'Authorization': `Bearer ${token}` } }
    );
    if (r.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      throw new Error('session Strava expirée, reconnecte ton compte');
    }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const activities = await r.json();
    if (!Array.isArray(activities)) throw new Error('réponse Strava inattendue');
    cache = { activities };
    stravaHistory = stravaToHistory(activities);
    strengthHistory = stravaToStrength(activities);
    stravaSyncedAt = new Date().toISOString();
    saveAppState();
    rerenderCurrentTab();
  } catch(err) {
    console.error('syncStrava error:', err);
    if (document.getElementById('sync-status')) {
      document.getElementById('sync-status').textContent = 'Erreur de synchronisation Strava.';
    }
    showToast(`Sync Strava impossible — ${escapeHtml(err.message)}.`, 'error', 6000);
  } finally {
    syncInFlight = false;
    document.querySelectorAll('.mini-action').forEach(b => b.disabled = false);
  }
}

function daysBetween(a, b) {
  return Math.ceil((parseLocalDate(a) - b) / 86400000);
}

function fmtDurationMinutes(totalMinutes) {
  const h = Math.floor(totalMinutes / 60);
  const m = Math.round(totalMinutes % 60);
  return `${h}h${String(m).padStart(2,'0')}`;
}

function paceForDistance(totalMinutes, distanceKm) {
  const pace = totalMinutes / distanceKm;
  const m = Math.floor(pace);
  const s = Math.round((pace - m) * 60);
  return `${m}:${String(s).padStart(2,'0')}/km`;
}

function fmtDeltaMinutes(delta) {
  const sign = delta > 0 ? '+' : delta < 0 ? '-' : '';
  return `${sign}${fmtDurationMinutes(Math.abs(delta))}`;
}

function average(values) {
  return values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
}

function marathonForecast(model) {
  const roadRuns = trainingHistory()
    .filter(a => a.type === 'Run' && a.spd > 2.0 && a.km >= 5)
    .sort((a,b) => a.d.localeCompare(b.d));
  const anchors = roadRuns
    .filter(a => a.km >= 8)
    .map(a => {
      const minutes = a.km * 1000 / a.spd / 60;
      const predicted = minutes * Math.pow(42.195 / a.km, 1.07);
      return { ...a, minutes, predicted };
    })
    .sort((a,b) => a.predicted - b.predicted);

  const bestAnchor = anchors[0];
  const recent = roadRuns.slice(-8);
  const recentPace = average(recent.map(a => 1000 / a.spd / 60));
  const longestRoad = Math.max(...roadRuns.map(a => a.km), 0);
  const volume = model.weeklyAvg || 0;
  const remainingWeeks = Math.max(0, Math.ceil((RACE_DATE - model.now) / MS_WEEK));

  let predicted = bestAnchor ? bestAnchor.predicted : recentPace * 42.195 * 1.12;
  const volumePenalty = volume < 25 ? 12 : volume < 35 ? 7 : volume < 45 ? 3 : 0;
  const longRunPenalty = longestRoad < 18 ? 10 : longestRoad < 25 ? 5 : 0;
  const readinessPenalty = model.score < 58 ? 5 : model.score < 75 ? 2 : 0;
  const futureCredit = clamp(remainingWeeks * 0.75, 4, 14);
  predicted = Math.round(predicted + volumePenalty + longRunPenalty + readinessPenalty - futureCredit);

  const confidence = clamp(
    38 +
    Math.min(24, roadRuns.length * 2) +
    Math.min(18, longestRoad) +
    Math.min(16, volume / 2),
    35,
    90
  );
  const delta = predicted - targetMinutes;
  const explanation = bestAnchor
    ? `Base: ${bestAnchor.km.toFixed(1)} km route converti en équivalent marathon, corrigé par volume récent, sortie longue, forme et semaines restantes.`
    : 'Base limitée: pas assez de sortie route longue, estimation surtout construite sur allure récente et charge.';

  return {
    minutes: predicted,
    pace: paceForDistance(predicted, 42.195),
    confidence: Math.round(confidence),
    delta,
    explanation,
  };
}

function sessionKey(weekIdx, dayIdx) {
  return `${weekIdx}-${dayIdx}`;
}

function sessionLogMeta(status) {
  return {
    done: { label:'Validée', color:'#16A34A', cls:'done' },
    adjusted: { label:'Allégée', color:'#D97706', cls:'adjusted' },
    skipped: { label:'Sautée', color:'#DC2626', cls:'skipped' },
  }[status] || null;
}

function weekAdherence(weekIdx) {
  const sessions = weekSessions(weekIdx).filter(s => s.type !== 'rest');
  if (!sessions.length) return { done:0, total:0, pct:0, adjusted:0, skipped:0, auto:0 };
  // Jours (effectifs) où une sortie a réellement eu lieu cette semaine → validation auto
  const ws = weekStart(weekIdx);
  const we = new Date(ws.getTime() + 7 * 86400000);
  const activeDays = new Set();
  trainingHistory().forEach(a => {
    const d = parseLocalDate(a.d);
    if (d >= ws && d < we) activeDays.add(dayOfWeek(d));
  });
  const counts = sessions.reduce((acc, s) => {
    const status = sessionLogs[sessionKey(weekIdx, s.origDay)];
    if (status === 'done') acc.done += 1;
    else if (status === 'adjusted') { acc.done += 0.65; acc.adjusted += 1; }
    else if (status === 'skipped') acc.skipped += 1;
    else if (activeDays.has(s.day)) { acc.done += 1; acc.auto += 1; } // sortie Strava détectée ce jour
    return acc;
  }, { done:0, adjusted:0, skipped:0, auto:0 });
  return { ...counts, total:sessions.length, pct:Math.round(counts.done / sessions.length * 100) };
}

function defaultRaceEvent() {
  return {
    id:'porto-main',
    name:'Marathon de Porto',
    date:'2026-11-08',
    distance:42.2,
    type:'route',
    priority:'A',
  };
}

function upcomingEvents(includePorto = true) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const base = includePorto ? [...EVENTS, defaultRaceEvent()] : [...EVENTS];
  return base
    .filter(ev => parseLocalDate(ev.date) >= today)
    .sort((a,b) => a.date.localeCompare(b.date) || a.priority.localeCompare(b.priority));
}

function currentOrNextSession(now = new Date()) {
  const wi = weekIndex(now);
  const dow = dayOfWeek(now);
  const today = weekSessions(wi).find(s => s.day === dow);
  if (today) return { label:"Aujourd'hui", wi, s:today };
  const nx = nextSession(wi, dow);
  if (nx) return { label:'Prochaine séance', wi:nx.wi, s:nx.s };
  return { label:'Objectif final', wi:21, s:weekSessions(21).find(s => s.type === 'race') };
}

function dashboardModel() {
  const now = new Date();
  const wi = weekIndex(now);
  const week = PLAN[wi];
  const ph = PHASES[week.phase];
  const end = new Date(now); end.setHours(23,59,59,999);
  const start7 = new Date(end.getTime() - 6 * 86400000); start7.setHours(0,0,0,0);
  const start28 = new Date(end.getTime() - 27 * 86400000); start28.setHours(0,0,0,0);
  const last7 = kmBetween(start7, end);
  const last28 = kmBetween(start28, end);
  const weeklyAvg = last28 / 4;
  const lastActivity = [...trainingHistory()].sort((a,b) => b.d.localeCompare(a.d))[0];
  const daysSinceLast = lastActivity ? Math.max(0, Math.floor((now - parseLocalDate(lastActivity.d)) / 86400000)) : 99;
  const loadRatio = week.vol ? last7 / week.vol : 1;
  const feelingAdjust = { sharp:8, normal:0, tired:-12, sore:-22 }[athleteFeeling] || 0;
  let score = 86 + feelingAdjust;
  if (loadRatio > 1.25) score -= Math.min(26, Math.round((loadRatio - 1.25) * 22));
  if (lastActivity?.km > 30) score -= 16;
  if (daysSinceLast <= 1) score -= 6;
  score = clamp(Math.round(score), 28, 96);

  const status = score >= 78
    ? { label:'Prêt', color:'#0F766E', bg:'#F0FDFA' }
    : score >= 58
      ? { label:'À doser', color:'#D97706', bg:'#FFFBEB' }
      : { label:'Récup', color:'#DC2626', bg:'#FEF2F2' };

  const recommendation = score >= 78
    ? "Tu peux tenir le plan prévu. Garde les footings vraiment faciles et protège la séance clé de la semaine."
    : score >= 58
      ? "On garde la structure, mais on coupe l'intensité si les jambes sont lourdes. Le bénéfice aujourd'hui vient de la régularité, pas du forcing."
      : "Priorité fraîcheur. Transforme toute intensité en endurance douce ou repos actif: le corps assimile encore la charge récente.";

  const adherence = weekAdherence(wi);

  return {
    now, wi, week, ph, last7, weeklyAvg, loadRatio, lastActivity,
    daysSinceLast, score, status, recommendation, adherence,
    focus: currentOrNextSession(now),
    nextEvent: upcomingEvents(true)[0],
  };
}

function coachDecisions(model) {
  const focus = model.focus.s;
  const event = model.nextEvent;
  const isQuality = ['tempo','intervals','marathon_pace','long','race'].includes(focus.type);
  const decisions = [];
  decisions.push({
    color: model.status.color,
    title: model.score < 58 ? 'Décision du jour: absorber' : isQuality ? 'Décision du jour: séance à protéger' : 'Décision du jour: régularité',
    copy: model.score < 58
      ? 'Garde la durée courte et facile. Si la foulée n’est pas fluide après 10 minutes, tu bascules en repos actif.'
      : isQuality
        ? 'Échauffement propre, exécution contrôlée, aucune chasse au chrono hors consigne.'
        : 'Footing conversationnel. La valeur vient du volume facile et de la fraîcheur conservée.',
  });
  decisions.push({
    color: event?.type === 'trail' ? '#0F766E' : '#0284C7',
    title: event?.type === 'trail' ? 'Spécificité trail' : 'Spécificité route',
    copy: event?.type === 'trail'
      ? 'Ajoute du terrain vallonné et du travail de descente léger sur les sorties faciles, sans transformer chaque séance en chantier.'
      : 'Priorité économie de course: allure stable, cadence propre, ravitaillement testé sur les longues.',
  });
  decisions.push({
    color: model.loadRatio > 1.15 ? '#D97706' : '#16A34A',
    title: model.loadRatio > 1.15 ? 'Risque charge: surveiller' : 'Charge: fenêtre favorable',
    copy: model.loadRatio > 1.15
      ? 'Tu es au-dessus du plan récent. Le prochain gain vient de la récupération, pas d’une séance ajoutée.'
      : 'La charge reste maîtrisée. Tu peux construire sans précipiter la montée en volume.',
  });
  decisions.push({
    color: model.adherence.pct >= 75 ? '#16A34A' : model.adherence.pct >= 40 ? '#D97706' : '#DC2626',
    title: `Exécution semaine: ${model.adherence.pct}%`,
    copy: model.adherence.total
      ? `${model.adherence.auto} détectée(s) via Strava, ${model.adherence.adjusted} allégée(s), ${model.adherence.skipped} sautée(s). Tes sorties valident les séances automatiquement.`
      : 'Semaine sans séance active à cocher.',
  });
  return decisions;
}

function eventBlueprint(ev) {
  if (ev.priority === 'A') {
    return ev.type === 'trail'
      ? 'Bloc spécifique: longues vallonnées, descente contrôlée, nutrition testée et une semaine d’affûtage stricte.'
      : 'Bloc spécifique: allure cible, ravitaillement, sortie longue structurée et affûtage sans fatigue cachée.';
  }
  if (ev.priority === 'B') {
    return 'Course test: valider pacing, matériel et fraîcheur. On accepte de courir fort, mais sans compromettre la course A.';
  }
  return 'Course d’entraînement: expérience, terrain et plaisir. Objectif principal: apprendre sans dette de fatigue.';
}

function eventRaceStrategy(ev) {
  const model = dashboardModel();
  const marathon = marathonForecast(model);
  const distance = Number(ev.distance) || 10;
  const isTrail = ev.type === 'trail';
  const basePace = ev.priority === 'A'
    ? (distance >= 40 && !isTrail ? targetMinutes / 42.195 : marathon.minutes / 42.195)
    : ev.priority === 'B'
      ? marathon.minutes / 42.195 * 0.96
      : marathon.minutes / 42.195 * 1.08;
  const terrainFactor = isTrail ? 1.18 : 1;
  const pace = paceForDistance(basePace * distance * terrainFactor, distance);
  const expected = fmtDurationMinutes(Math.round(basePace * distance * terrainFactor));
  const fuel = distance < 15
    ? 'eau si besoin'
    : distance < 25
      ? '1 gel vers 45min'
      : isTrail
        ? '30-45g glucides/h + eau'
        : 'gel toutes les 30min';
  const focus = isTrail
    ? 'montées en contrôle, descentes propres, effort constant'
    : distance >= 30
      ? 'départ retenu, ravito strict, dernier tiers progressif'
      : 'pacing régulier, pas de départ trop rapide';
  const checklist = isTrail
    ? 'chaussures trail, flasque, sel si chaleur, test sac'
    : 'chaussures course, gels testés, plan km 5/10/semi';
  return { pace, expected, fuel, focus, checklist };
}

function sessionBlocks(session, model) {
  if (!session || session.type === 'rest') {
    return [
      { title:'Objectif', copy:'Faire descendre la charge nerveuse et laisser les adaptations se consolider.' },
      { title:'Option active', copy:'20 à 35 minutes de marche souple ou mobilité hanches/mollets si tu as besoin de bouger.' },
      { title:'Signal à suivre', copy:'Si les jambes restent lourdes demain matin, on privilégie endurance facile plutôt qu’intensité.' },
    ];
  }

  const commonWarmup = session.type === 'easy' || session.type === 'long'
    ? '10 minutes très faciles. Tu dois pouvoir parler sans chercher ton souffle.'
    : '15 minutes faciles + 4 lignes droites progressives de 15 secondes, récup complète.';

  const main = {
    recovery:'Tout en relâchement. Reste sous la zone de confort, aucune accélération nécessaire.',
    easy:'Endurance fondamentale stable. Cherche une foulée silencieuse, cadence propre, respiration basse.',
    fartlek:'Alterner les blocs rapides et faciles sans sprinter. La variation doit rester contrôlée.',
    tempo:'Bloc au seuil: solide mais soutenable. Tu finis avec la sensation d’en avoir encore sous le pied.',
    intervals:'Répétitions régulières. Le dernier intervalle doit ressembler au premier, pas à une survie.',
    marathon_pace:'Caler l’allure marathon avec économie: relâchement des épaules, ravitaillement test si séance longue.',
    long:'Construire l’endurance. Départ volontairement lent, progression douce seulement si les jambes répondent.',
    race:'Exécution course: départ retenu, hydratation régulière, focus sur les 10 derniers kilomètres.',
  }[session.type] || session.desc;

  const planB = model.score < 58
    ? 'Plan B recommandé: retirer toute intensité, limiter à 35-45 minutes faciles ou repos si la foulée est raide.'
    : model.score < 78
      ? 'Plan B: garde la séance mais coupe 15 à 25% du volume si la perception dépasse 7/10.'
      : 'Plan B seulement si douleur inhabituelle: bascule en footing facile et note la sensation.';

  return [
    { title:'Échauffement', copy:commonWarmup },
    { title:'Bloc principal', copy:main },
    { title:'Retour au calme', copy:'8 à 12 minutes faciles, puis 3 minutes de respiration lente avant de repartir dans ta journée.' },
    { title:'Adaptation coach', copy:planB },
  ];
}

const PAIN_ZONES = [
  { key:'knee',     lbl:'Genou',   emoji:'🦵' },
  { key:'calf',     lbl:'Mollet',  emoji:'🦵' },
  { key:'achilles', lbl:'Achille', emoji:'🦶' },
  { key:'thigh',    lbl:'Cuisse',  emoji:'🦵' },
  { key:'hip',      lbl:'Hanche',  emoji:'🦴' },
  { key:'foot',     lbl:'Pied',    emoji:'🦶' },
  { key:'other',    lbl:'Autre',   emoji:'❓' },
];

function adaptationPlan(session, reason, zone, model, wi, origDay, dayIdx) {
  const tomorrow = Math.min(dayIdx + 1, 6);
  const moveBtn = { label:'📅 Décaler à demain', action:`moveSession(${wi},${origDay},${tomorrow})` };
  const skip   = r => ({ label:'🛑 Sautée + repos',  action:`setSessionLog(${wi},${origDay},'skipped','${r}')` });
  const adjust = r => ({ label:'➖ Alléger',          action:`setSessionLog(${wi},${origDay},'adjusted','${r}')` });
  const isQuality = ['tempo','intervals','marathon_pace','fartlek'].includes(session.type);
  const isLong = session.type === 'long';

  if (reason === 'pain') {
    if (!zone) return { intro:"Une douleur, ce n'est pas une fatigue : on ne « passe pas au travers ». Dis-moi où, je te donne le bon réflexe." };
    const z = {
      knee:    { t:'Genou — prudence essuie-glace (ITBS)', c:"Très probable syndrome de l'essuie-glace après ton marathon trail. Règle simple : <b>zéro course tant que c'est douloureux à la descente d'escalier</b>. On garde la jambe active autrement — renfo moyen fessier + glace 10-15 min, et vélo/natation si indolore.", renfo:'glutes' },
      calf:    { t:'Mollet — ta zone à surveiller',        c:"Mollet sensible = <b>pas de fractionné ni de côtes</b> aujourd'hui. Footing très court seulement si totalement indolore, sinon repos, étirements doux et hydratation.", renfo:'core' },
      achilles:{ t:'Tendon d’Achille — à ne pas brusquer',  c:"Le tendon n'aime ni la vitesse ni les relances. <b>Stop l'intensité</b>, excentriques mollets légers, reprise seulement si plus de douleur à froid le matin.", renfo:'core' },
      thigh:   { t:'Cuisse — surcharge musculaire',         c:"Quadris/ischios chargés après le trail. Footing souple court possible si la douleur s'efface en courant, sinon repos + mobilité. Pas de qualité aujourd'hui.", renfo:'legs' },
      hip:     { t:'Hanche — chaîne fessiers',              c:"Souvent un déficit de gainage latéral/fessiers. Repos course conseillé + renfo hanches/fessiers ciblé pour reconstruire la stabilité avant de relancer le volume.", renfo:'glutes' },
      foot:    { t:'Pied — on ne joue pas',                 c:"Repos, vérifie le chaussant, glace si point précis. Reprise progressive ; si ça persiste, avis pro (aponévrose plantaire).", renfo:'core' },
      other:   { t:'Douleur — on lève le pied',             c:"Dans le doute, on protège : repos ou cross-training sans douleur aujourd'hui, et on réévalue demain à froid.", renfo:'glutes' },
    }[zone];
    const rlabel = `douleur ${(PAIN_ZONES.find(p => p.key === zone) || { lbl:zone }).lbl.toLowerCase()}`;
    const opts = [ skip(rlabel) ];
    if (z.renfo) opts.push({ label:`💪 Remplacer par renfo ${STRENGTH_FOCUS[z.renfo].short}`, action:`quickRenfo('${z.renfo}','${rlabel}',${wi},${origDay})` });
    opts.push(moveBtn);
    return { title:z.t, copy:`${z.c} <i>Douleur vive ou qui dure plus de 4-5 jours → avis kiné.</i>`, options:opts };
  }

  if (reason === 'fatigue') {
    const deep = model.score < 58 || ['tired','sore'].includes(athleteFeeling);
    return deep
      ? { title:'Fatigue réelle — on récupère', copy:"Ton niveau de forme est bas : le gain du jour vient du repos, pas du forcing. Transforme en footing très court (30-40 min facile) ou repos complet.", options:[ adjust('fatigue'), skip('fatigue'), moveBtn ] }
      : { title:'Coup de mou — test 10 minutes', copy:"Échauffe-toi 10 minutes très faciles. Si les jambes ne viennent pas, tu réduis ou tu rentres — souvent ça se débloque. Sinon allège sans culpabiliser.", options:[ adjust('fatigue'), moveBtn ] };
  }

  if (reason === 'time') {
    const copy = isLong
      ? "Sortie longue + peu de temps : mieux vaut la décaler que la bâcler. Si vraiment impossible, fais 60-70 % du volume à allure facile."
      : isQuality
        ? "Garde le cœur de séance, coupe l'échauffement long et le retour au calme. Version express : moitié du volume de qualité, ça reste utile."
        : "Footing express 20-25 min : ça compte et ça entretient. Ne saute pas pour 20 minutes de moins.";
    return { title:'Manque de temps — version maligne', copy, options:[ adjust('manque de temps'), moveBtn ] };
  }

  if (reason === 'weather') {
    return { title:'Météo — plan B', copy:"Tapis de course (tu peux y caler l'allure cible), séance indoor, ou décale d'un jour. Sur sol glissant : pas de fractionné ni de descentes rapides.", options:[ moveBtn, adjust('météo') ] };
  }

  if (reason === 'travel') {
    return { title:'Déplacement — rester actif simplement', copy:"Footing libre selon le temps et le spot sur place, ou renfo au poids du corps si tu ne peux pas courir. L'objectif : ne pas casser la régularité.", options:[ moveBtn, { label:'💪 Noter un renfo à la place', action:`quickRenfo('full','déplacement',${wi},${origDay})` }, skip('déplacement') ] };
  }

  return { title:'Adapter', copy:"Dis-moi ce qui coince et je te propose une alternative.", options:[ adjust('autre'), moveBtn ] };
}

function coachAdapt(wi, origDay, dayIdx, reason, zone) {
  const session = weekSessions(wi).find(s => s.origDay === origDay) || { type:'rest' };
  const model = dashboardModel();
  const plan = adaptationPlan(session, reason, zone, model, wi, origDay, dayIdx);
  document.querySelectorAll('.reason-btn').forEach(b => b.classList.toggle('active', b.dataset.reason === reason && !zone));
  const box = document.getElementById('coach-adapt-result');
  if (!box) return;
  if (reason === 'pain' && !zone) {
    box.innerHTML = `
      <div class="adapt-card">
        <div class="adapt-copy">${plan.intro}</div>
        <div class="reprogram-label" style="margin-top:10px">Où as-tu mal ?</div>
        <div class="reason-grid zone-grid">
          ${PAIN_ZONES.map(p => `<button type="button" class="reason-btn" onclick="coachAdapt(${wi},${origDay},${dayIdx},'pain','${p.key}')">${p.emoji} ${p.lbl}</button>`).join('')}
        </div>
      </div>`;
    return;
  }
  box.innerHTML = `
    <div class="adapt-card">
      <div class="adapt-title">${plan.title}</div>
      <div class="adapt-copy">${plan.copy}</div>
      <div class="adapt-actions">
        ${plan.options.map(o => `<button type="button" class="adapt-action" onclick="${o.action}">${o.label}</button>`).join('')}
      </div>
    </div>`;
}

// Remplace la séance course par un renfo (et marque la course comme sautée)
function quickRenfo(focus, reason, wi, origDay) {
  const d = new Date().toISOString().slice(0, 10);
  manualStrength.push({ id:`m-${Date.now()}-${Math.random().toString(16).slice(2)}`, d, name:'Renfo (coach)', min:0, focus, source:'manual' });
  if (Number.isInteger(wi) && Number.isInteger(origDay)) {
    const key = sessionKey(wi, origDay);
    sessionLogs[key] = 'skipped';
    if (reason) sessionLogReason[key] = reason;
  }
  saveAppState();
  closeSessionDetail();
  rerenderCurrentTab();
  showToast(`Renfo ${STRENGTH_FOCUS[focus]?.short || ''} enregistré · séance course remplacée.`);
}

      </div>` : '';
  const reprogram = isReal ? `

      <div class="session-head">
        <div>
          <div class="session-title">${type.name}</div>

        </div>
        <button class="close-btn" type="button" onclick="closeSessionDetail()">×</button>

        <div class="session-hero-grid">
          <div class="session-stat"><div class="session-stat-val">${session.dist > 0 ? session.dist + ' km' : 'Repos'}</div><div class="session-stat-lbl">volume</div></div>

        <button class="primary-action" type="button" onclick="closeSessionDetail()">Séance comprise</button>
      </div>
    </div>`;
  modal.classList.add('open');
}

function closeSessionDetail(e) {
  if (e && e.target && e.target.id !== 'session-modal') return;
  const modal = document.getElementById('session-modal');
  modal.classList.remove('open');
  modal.innerHTML = '';
}

function setSessionLog(weekIdx, origDay, status, reason) {
  const key = sessionKey(weekIdx, origDay);
  sessionLogs[key] = status;
  if (reason) sessionLogReason[key] = reason; else delete sessionLogReason[key];
  saveAppState();
  closeSessionDetail();
  rerenderCurrentTab();
  const meta = sessionLogMeta(status);
  if (meta) showToast(`Séance marquée « ${meta.label} »${reason ? ` · ${reason}` : ''}.`);
}

function renderWeek() {
  const now  = new Date();
  const wi   = weekIndex(now);
  const ws   = weekStart(wi);
  const week = PLAN[wi];
  const ph   = PHASES[week.phase];
  const dow  = dayOfWeek(now);

  const byDay = {};
  weekSessions(wi).forEach(s => byDay[s.day] = s);
  const eventsByDay = {};
  eventsForWeek(wi).forEach(ev => {
    const d = dayOfWeek(parseLocalDate(ev.date));
    if (!eventsByDay[d]) eventsByDay[d] = [];
    eventsByDay[d].push(ev);
  });

  // Sorties réellement effectuées cette semaine (Strava + historique)
  const weekEnd = new Date(ws.getTime() + 7 * 86400000);
  const realByDay = {};
  trainingHistory().forEach(a => {
    const d = parseLocalDate(a.d);
    if (d >= ws && d < weekEnd) {
      const k = dayOfWeek(d);
      if (!realByDay[k]) realByDay[k] = { km: 0, spd: [] };
      realByDay[k].km += a.km;
      if (a.spd > 0) realByDay[k].spd.push(a.spd);
    }
  });
  const realSnippet = d => {
    const r = realByDay[d];
    if (!r) return '';
    return `<div class="sesh-real">✓ ${r.km.toFixed(1)} km réalisés${r.spd.length ? ' · ' + fmtPace(average(r.spd)) : ''}</div>`;
  };

  // Séances de renfo réalisées cette semaine
  const strengthByDay = {};
  allStrength().forEach(s => {
    const d = parseLocalDate(s.d);
    if (d >= ws && d < weekEnd) (strengthByDay[dayOfWeek(d)] ||= []).push(s);
  });
  const strengthSnippet = d => (strengthByDay[d] || []).map(s => {
    const f = STRENGTH_FOCUS[s.focus];
    return `<div class="sesh-real" style="color:${f ? f.color : '#7C3AED'}">💪 Renfo${f ? ' · ' + f.short : ''}${s.min ? ' · ' + s.min + ' min' : ''}</div>`;
  }).join('');

  let html = `
    <div class="phase-badge" style="background:${ph.bg};color:${ph.color}">
      <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${ph.color}"></span>
      ${ph.name} — Semaine ${wi+1} — ${week.vol} km planifiés
    </div>
    <div class="week-grid">`;

  for (let d = 0; d < 7; d++) {
    const dt  = new Date(ws.getTime() + d * 86400000);
    const sn  = byDay[d];
    const cls = d === dow ? 'today' : d < dow ? 'past' : '';
    const dayEvents = eventsByDay[d] || [];
    const logKey = sn ? sn.origDay : d;
    const log = sessionLogMeta(sessionLogs[sessionKey(wi, logKey)]);
    const logClass = log ? `logged ${log.cls}` : '';
    const logTag = log ? `<span class="log-tag" style="background:${log.color}">${log.label}</span>` : '';
    const movedTag = sn && sn.moved ? `<span class="moved-tag" title="Déplacée">↕</span>` : '';

    if (!sn) {
      html += `
        <div class="day-card ${cls} ${logClass}" onclick="openSessionDetail(${wi}, ${d})">
          <div class="day-date"><div class="day-abbr">${DAYS_FR[d]}</div><div class="day-num">${dt.getDate()}</div></div>
          <div class="sesh-icon" style="background:#F3F4F6;color:#9CA3AF">${iconSvg('rest')}</div>
          <div class="sesh-info">
            <div class="sesh-name" style="color:#9CA3AF">Repos</div>
            ${realSnippet(d)}
            ${strengthSnippet(d)}
            ${eventSnippet(dayEvents)}
          </div>
          ${logTag}
          ${d===dow?'<span class="today-tag">Aujourd\'hui</span>':''}
        </div>`;
    } else {
      const tp = T[sn.type];
      html += `
        <div class="day-card ${cls} ${logClass}" onclick="openSessionDetail(${wi}, ${d})">
          <div class="day-date"><div class="day-abbr">${DAYS_FR[d]}</div><div class="day-num">${dt.getDate()}</div></div>
          <div class="sesh-icon" style="background:${tp.bg};color:${tp.color}">${iconSvg(tp.icon)}</div>
          <div class="sesh-info">
            <div class="sesh-name">${tp.name}${movedTag}</div>
            <div class="sesh-desc">${sn.desc}</div>
            ${realSnippet(d)}
            ${strengthSnippet(d)}
            ${eventSnippet(dayEvents)}
          </div>
          <div class="sesh-meta">
            ${sn.dist > 0 ? sn.dist+' km' : ''}
            <div class="sesh-pace">${sn.pace}</div>
          </div>
          ${logTag}
          ${d===dow?'<span class="today-tag">Aujourd\'hui</span>':''}
        </div>`;
    }
  }

  html += `</div>
    <div class="paces-card" style="margin-top:12px">
      <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.4px">Allures de référence</div>
      <div class="paces-grid">
        <div class="pace-row"><span class="pace-dot" style="background:#16A34A"></span>EF facile: <b>6:30-7:00</b></div>
        <div class="pace-row"><span class="pace-dot" style="background:#0284C7"></span>Allure M: <b>5:30/km</b></div>
        <div class="pace-row"><span class="pace-dot" style="background:#DC2626"></span>Tempo: <b>5:00-5:10</b></div>
        <div class="pace-row"><span class="pace-dot" style="background:#7C3AED"></span>Fractionné: <b>4:45-4:55</b></div>
      </div>
    </div>`;

  document.getElementById('content').innerHTML = html;
}

function renderPlan() {
  const now  = new Date();
  const cwi  = weekIndex(now);
  const model = dashboardModel();
  const maxV = Math.max(...PLAN.map(w => w.vol));
  const MO   = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

  let html = `
    <div class="section-title">Plan 22 semaines — Porto Marathon</div>
    <div class="legend-row">`;
  Object.entries(PHASES).forEach(([,p]) => {
    html += `<span class="legend-tag" style="background:${p.bg};color:${p.color}">${p.name}</span>`;
  });
  html += `</div><div class="plan-scroll">`;

  PLAN.forEach((week, i) => {
    const ph   = PHASES[week.phase];
    const ws   = weekStart(i);
    const we   = new Date(ws.getTime() + 6*86400000);
    const isCur = i === cwi;
    const isPast = i < cwi;
    const actualKm = i <= cwi ? kmBetween(ws, we) : null;
    const label = `${ws.getDate()} ${MO[ws.getMonth()]} – ${we.getDate()} ${MO[we.getMonth()]}`;
    const barW  = Math.round((week.vol / maxV) * 100);
    const nSess = week.sessions.filter(s => s.type !== 'rest').length;
    const weekEvents = eventsForWeek(i);
    const currentAdvice = isCur ? `
      <div class="pw-advice">
        <b>Coach adaptatif:</b> ${model.recommendation}
      </div>` : '';
    const weekEventsHtml = weekEvents.length ? `
      <div class="pw-events">
        ${weekEvents.map(ev => {
          const ps = priorityStyle(ev.priority);
          return `
            <div class="pw-event">
              <span class="priority-badge" style="width:18px;height:18px;font-size:9px;background:${ps.color}">${ev.priority}</span>
              ${iconSvg('event')}
              <span class="pw-event-name">${escapeHtml(ev.name)}</span>
              <span class="pw-event-meta">${fmtEventDate(ev.date)} · ${ev.distance} km · ${eventTypeLabel(ev.type)}</span>
            </div>`;
        }).join('')}
      </div>` : '';

    html += `
      <div class="plan-week ${isCur ? 'current' : ''}" style="${isPast ? 'opacity:0.5' : ''}">
        <div class="pw-header">
          <span class="pw-num">Sem. ${i+1}</span>
          <span class="pw-dot" style="background:${ph.color}"></span>
          <span class="pw-name">${ph.name}${isCur ? ' <span class="current-tag">En cours</span>' : ''}</span>
          <span class="pw-vol">${actualKm !== null
            ? `<b style="color:${actualKm >= week.vol * 0.9 ? '#0F766E' : '#B45309'}">${Math.round(actualKm)}</b>/${week.vol} km`
            : `${week.vol} km`}</span>
        </div>
        <div class="pw-dates">${label} · ${nSess} séance${nSess>1?'s':''}</div>
        <div class="pw-bar"><div class="pw-fill" style="width:${barW}%;background:${ph.color}"></div></div>
        ${currentAdvice}
        ${weekEventsHtml}
      </div>`;
  });

  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}
