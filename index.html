function createEvent(e) {
  e.preventDefault();
  const data = new FormData(e.currentTarget);
  const distance = Number(data.get('distance'));
  if (!Number.isFinite(distance) || distance <= 0) return;

  EVENTS.push({
    id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
    name: data.get('name').trim(),
    date: data.get('date'),
    distance: Math.round(distance * 10) / 10,
    type: data.get('type'),
    priority: data.get('priority'),
  });
  saveAppState();
  renderEvents();
  showToast('Course ajoutée — le coach en tient compte dans la stratégie.');
}

function deleteEvent(id) {
  EVENTS = EVENTS.filter(ev => ev.id !== id);
  saveAppState();
  renderEvents();
  showToast('Course supprimée.');
}

// ─────────────────────────────────────────────────────────────
// TAB 4 — MES SORTIES
// ─────────────────────────────────────────────────────────────
// Lecture coach locale : allure vs zones du plan + comparaison à la séance prévue
function activityInsight(act) {
  const km = (act.distance || 0) / 1000;
  const paceMin = act.average_speed > 0 ? 1000 / act.average_speed / 60 : null;
  const dateStr = String(act.start_date_local || act.start_local || '').slice(0, 10);
  const d = dateStr ? parseLocalDate(dateStr) : null;
  const isTrail = act.sport_type === 'TrailRun';
  const parts = [];

  // Séance prévue ce jour-là (si on est dans la fenêtre du plan)
  if (d && d >= PLAN_START && d <= RACE_DATE) {
    const planned = weekSessions(weekIndex(d)).find(s => s.day === dayOfWeek(d));
    if (planned && planned.type !== 'rest' && planned.dist > 0) {
      const typeName = T[planned.type]?.name || planned.type;
      const ratio = km / planned.dist;
      if (ratio >= 0.85 && ratio <= 1.2) parts.push(`Colle au plan (${typeName} ${planned.dist} km prévu).`);
      else if (ratio < 0.85) parts.push(`Plus court que prévu (${typeName} ${planned.dist} km) — ok si c’était le besoin du jour.`);
      else parts.push(`Plus long que prévu (${typeName} ${planned.dist} km) — attention à la charge cachée.`);
    } else if (planned && planned.type === 'rest') {
      parts.push('Jour de repos au plan — si tu cours quand même, garde-le très facile.');
    }
  }

  if (isTrail) {
    const dplus = Math.round(act.total_elevation_gain || 0);
    parts.push(`Trail${dplus ? ` +${dplus} m` : ''} : juge à l’effort, pas à l’allure. Bon transfert pour le profil vallonné.`);
  } else if (paceMin) {
    if (paceMin >= 6.5) parts.push(`${fmtPace(act.average_speed)} — bien dans la zone EF, c’est exactement ce qui construit la base.`);
    else if (paceMin >= 6.0) parts.push(`${fmtPace(act.average_speed)} — un cran sous la zone EF (6:30-7:00) : ralentis sur les footings.`);
    else if (paceMin >= 5.2) parts.push(`${fmtPace(act.average_speed)} — zone marathon/tempo : parfait si c’était voulu, piège si c’était un footing.`);
    else parts.push(`${fmtPace(act.average_speed)} — travail rapide : assure une vraie récupération derrière.`);
  }

  if (act.average_heartrate) {
    const hrMax = 220 - (Number(athleteProfile.age) || 33);
    parts.push(`FC moy. ${Math.round(act.average_heartrate)} bpm (≈${Math.round(act.average_heartrate / hrMax * 100)}% FCmax estimée).`);
  }

  return parts.slice(0, 3).join(' ') || 'Sortie enregistrée — pas assez de données pour une lecture détaillée.';
}

function strengthFocusChips(s) {
  return Object.entries(STRENGTH_FOCUS).map(([key, f]) => `
    <button type="button" class="focus-chip ${s.focus === key ? 'active' : ''}"
      style="${s.focus === key ? `background:${f.bg};color:${f.color};border-color:${f.color}` : ''}"
      onclick="setStrengthFocus('${s.id}','${key}')">${f.short}</button>`).join('');
}

function renderStrengthSection() {
  const list = allStrength();
  const today = new Date().toISOString().slice(0, 10);
  const cards = list.slice(0, 12).map(s => {
    const f = s.focus ? STRENGTH_FOCUS[s.focus] : null;
    return `
      <div class="act-card strength-card">
        <div class="act-header">
          <div>
            <div class="act-name">${iconSvg('strength')}${escapeHtml(s.name)}</div>
            <div class="act-date">${fmtEventDate(s.d)}${s.min ? ' · ' + s.min + ' min' : ''}${s.hr ? ' · ' + s.hr + ' bpm' : ''}${s.source === 'manual' ? ' · ajout manuel' : ''}</div>
          </div>
          ${f
            ? `<span class="type-badge" style="background:${f.bg};color:${f.color}">${f.short}</span>`
            : `<span class="type-badge" style="background:#FEF2F2;color:#DC2626">à taguer</span>`}
        </div>
        <div class="focus-hint">Type de renfo — tape pour taguer :</div>
        <div class="focus-row">${strengthFocusChips(s)}</div>
        ${s.source === 'manual'
          ? `<button type="button" class="strength-del" onclick="deleteManualStrength('${s.id}')">Supprimer</button>`
          : ''}
      </div>`;
  }).join('');

  return `
    <div class="section-title" style="margin-top:22px">Renforcement musculaire</div>
    <div class="strength-intro">
      ${strengthCount(28)} séance(s) sur 28 jours. Tague le focus (le « bouton renfo jambes ») pour suivre l'équilibre.
      ${isStravaConnected() ? 'Les séances muscu Strava remontent ici automatiquement.' : ''}
    </div>
    <form class="event-form strength-form" onsubmit="addManualStrength(event)">
      <div class="form-grid">
        <label class="form-field">
          <span class="form-label">Date</span>
          <input name="date" type="date" max="${today}" value="${today}" required>
        </label>
        <label class="form-field">
          <span class="form-label">Durée (min)</span>
          <input name="min" type="number" min="0" max="240" step="5" placeholder="30">
        </label>
        <label class="form-field">
          <span class="form-label">Focus</span>
          <select name="focus">
            ${Object.entries(STRENGTH_FOCUS).map(([k, f]) => `<option value="${k}">${f.lbl}</option>`).join('')}
          </select>
        </label>
        <label class="form-field">
          <span class="form-label">Note (option)</span>
          <input name="name" type="text" maxlength="60" placeholder="Renfo maison">
        </label>
      </div>
      <button class="event-submit" type="submit">Ajouter une séance de renfo</button>
    </form>
    ${cards || '<div class="event-empty">Aucune séance de renfo pour l’instant. Ajoute-la ci-dessus ou synchronise Strava.</div>'}`;
}

async function renderActivities() {
  const content = document.getElementById('content');

  if (!isStravaConnected()) {
    content.innerHTML = `
      <div style="padding:32px;text-align:center">
        <div style="font-size:1.1rem;font-weight:600;margin-bottom:8px">Strava non connecté</div>
        <div style="color:#888;margin-bottom:20px">Connecte ton compte Strava pour voir tes sorties en direct.</div>
        <button onclick="connectStrava()" style="background:#FC4C02;color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600">Connecter Strava</button>
        <div style="color:#999;font-size:11px;margin-top:18px;line-height:1.5">
          Erreur « redirect_uri invalid » sur Strava ? Déclare <b class="cb-domain">${escapeHtml(window.location.hostname)}</b><br>
          comme domaine de callback sur <a href="https://www.strava.com/settings/api" target="_blank" rel="noopener">strava.com/settings/api</a>
          (app ID client ${STRAVA_CLIENT_ID}).
        </div>
      </div>
      ${renderStrengthSection()}`;
    fillCanonicalHost();
    return;
  }

  if (!cache) {
    content.innerHTML = '<div class="spinner-wrap"><div class="spin"></div> Récupération des sorties Strava…</div>';
    await syncStrava(); // re-rend l’onglet en cas de succès
    if (!cache) {
      content.innerHTML = `
        <div style="padding:20px;text-align:center;color:#888">
          Impossible de charger les activités Strava.
          <div style="margin-top:12px"><button class="mini-action" type="button" onclick="renderActivities()">Réessayer</button></div>
        </div>`;
    }
    return;
  }

  const runs = (cache.activities || []).filter(a =>
    ['Run','TrailRun'].includes(a.sport_type)
  );
  const shown = Math.min(runs.length, 10);

  let html = `<div class="section-title">Mes ${shown} dernières sorties</div>`;

  runs.slice(0, shown).forEach(act => {
    const st   = sportStyle(act.sport_type);
    const dist = fmtDist(act.distance || 0);
    const pace = fmtPace(act.average_speed || 0);
    const dur  = fmtTime(act.moving_time || 0);
    const elev = (act.total_elevation_gain || 0) > 5 ? `+${Math.round(act.total_elevation_gain)}m` : null;
    const hr   = act.average_heartrate ? `${Math.round(act.average_heartrate)} bpm` : null;

    html += `
      <div class="act-card">
        <div class="act-header">
          <div>
            <div class="act-name">${escapeHtml(act.name || 'Sortie')}</div>
            <div class="act-date">${fmtDate(act.start_date_local || act.start_local)}</div>
          </div>
          <span class="type-badge" style="background:${st.bg};color:${st.color}">${st.lbl}</span>
        </div>
        <div class="act-stats">
          <div class="ast"><div class="ast-val">${dist}</div><div class="ast-lbl">Distance</div></div>
          <div class="ast"><div class="ast-val">${pace}</div><div class="ast-lbl">Allure</div></div>
          <div class="ast"><div class="ast-val">${dur}</div><div class="ast-lbl">Durée</div></div>
          ${elev ? `<div class="ast"><div class="ast-val">${elev}</div><div class="ast-lbl">Dénivelé</div></div>` : ''}
          ${hr   ? `<div class="ast"><div class="ast-val">${hr}</div><div class="ast-lbl">FC moy.</div></div>` : ''}
          ${act.suffer_score ? `<div class="ast"><div class="ast-val">${act.suffer_score}</div><div class="ast-lbl">Effort rel.</div></div>` : ''}
        </div>
        <div class="ai-box">${iconSvg('ai')}${activityInsight(act)}</div>
      </div>`;
  });

  html += `
    <div style="display:flex;justify-content:center;margin-top:4px">
      <button class="ghost-action" type="button" onclick="syncStrava()">Resynchroniser Strava</button>
    </div>`;

  html += renderStrengthSection();
  content.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────
// TAB 5 — PROGRESSION (utilise HISTORY embarqué)
// ─────────────────────────────────────────────────────────────
function renderStats() {
  const history = trainingHistory();
  // Regrouper par semaine (lundi)
  const byWeek = {};
  history.forEach(a => {
    const d  = new Date(a.d);
    const dw = d.getDay()===0 ? 6 : d.getDay()-1;
    const mon = new Date(d - dw*86400000); mon.setHours(0,0,0,0);
    const key = mon.toISOString().slice(0,10);
    if (!byWeek[key]) byWeek[key] = { km:0, paces:[], hasNote:null };
    byWeek[key].km += a.km;
    if (a.type==='Run' && a.spd > 2.0) byWeek[key].paces.push(1000/a.spd/60);
    if (a.note) byWeek[key].hasNote = a.note;
  });

  const weeks   = Object.entries(byWeek).sort((a,b)=>a[0]<b[0]?-1:1);
  const labels  = weeks.map(([d]) => { const dt=new Date(d); return `${dt.getDate()}/${dt.getMonth()+1}`; });
  const kmData  = weeks.map(([,v]) => Math.round(v.km*10)/10);
  const pData   = weeks.map(([,v]) => v.paces.length ? +(v.paces.reduce((a,b)=>a+b,0)/v.paces.length).toFixed(2) : null);
  const notes   = weeks.map(([,v]) => v.hasNote);

  // KPIs globaux
  const roadRuns = history.filter(a => a.type==='Run' && a.spd > 2.0);
  const totalKm  = history.reduce((s,a)=>s+a.km, 0);
  const avgPace  = roadRuns.length ? fmtPace(roadRuns.reduce((s,a)=>s+a.spd,0)/roadRuns.length) : '—';
  const bestPace = roadRuns.length ? fmtPace(Math.max(...roadRuns.map(a=>a.spd))) : '—';
  const totalRuns = history.length;

  const wi  = weekIndex(new Date());
  const pct = Math.round((wi+1)/22*100);

  // Milestones
  const milestones = history.filter(a=>a.note).map(a=>`
    <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F0F0F0">
      <div class="milestone-icon">${iconSvg(a.type === 'Trail' ? 'long' : 'race')}</div>
      <div>
        <div style="font-size:12px;font-weight:700">${escapeHtml(cleanNote(a.note))}</div>
        <div style="font-size:11px;color:#888">${parseLocalDate(a.d).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} · ${a.km.toFixed(1)} km · ${fmtPace(a.spd)}</div>
      </div>
    </div>`).join('');

  // Période couverte par l'historique (s'étend au fil des syncs Strava)
  const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
  const monthOf = a => parseLocalDate(a.d).toLocaleDateString('fr-FR', { month:'long' });
  const periodLabel = history.length
    ? `${capitalize(monthOf(history[0]))} → ${monthOf(history[history.length-1])}`
    : '';

  let html = `
    <div class="section-title">Ma Progression${periodLabel ? ` — ${periodLabel}` : ''}</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-val">${Math.round(totalKm)}</div><div class="kpi-lbl">km depuis avril</div></div>
      <div class="kpi"><div class="kpi-val">${avgPace}</div><div class="kpi-lbl">Allure moy. route</div></div>
      <div class="kpi"><div class="kpi-val">${bestPace}</div><div class="kpi-lbl">Meilleure allure</div></div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Volume hebdomadaire (km route + trail)</div>
      <canvas id="c-km" height="170"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-title">Allure moyenne route par semaine (min/km · ↓ = plus rapide)</div>
      <canvas id="c-pace" height="160"></canvas>
    </div>

    ${milestones ? `
    <div class="chart-card">
      <div class="chart-title">Courses / Événements clés</div>
      ${milestones}
    </div>` : ''}

    <div class="chart-card">
      <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:8px">Avancement plan Porto Marathon</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px">
        <span>Semaine ${wi+1} / 22</span>
        <span style="font-weight:700;color:#E8521A">${pct}% du plan</span>
      </div>
      <div style="height:10px;background:#F0F0F0;border-radius:5px;overflow:hidden">
        <div style="height:100%;background:linear-gradient(90deg,#E8521A,#B83500);width:${pct}%;border-radius:5px"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#AAA">
        <span>8 juin 2026</span>
        <span>8 novembre 2026</span>
      </div>
    </div>`;

  document.getElementById('content').innerHTML = html;

  // Couleurs des barres : orange si la semaine a un événement notable
  const barColors = weeks.map(([,v]) =>
    v.hasNote ? '#B83500' : '#E8521A'
  );

  setTimeout(() => {
    if (charts.km) charts.km.destroy();
    charts.km = new Chart(document.getElementById('c-km'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{ label:'km', data:kmData, backgroundColor:barColors, borderRadius:5 }]
      },
      options: {
        responsive:true,
        plugins:{
          legend:{display:false},
          tooltip:{
            callbacks:{
              afterLabel: (ctx) => notes[ctx.dataIndex] ? notes[ctx.dataIndex] : ''
            }
          }
        },
        scales:{
          y:{beginAtZero:true, grid:{color:'#F0F0F0'}, ticks:{font:{size:10}}},
          x:{grid:{display:false}, ticks:{font:{size:10}}}
        }
      }
    });

    const validIdx = pData.map((p,i)=>p!==null?i:-1).filter(i=>i>=0);
    if (validIdx.length > 0) {
      // Ligne objectif marathon (5:30/km = 5.5)
      const targetLine = labels.map(()=>5.5);

      if (charts.pace) charts.pace.destroy();
      charts.pace = new Chart(document.getElementById('c-pace'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label:'Allure moy.',
              data: pData,
              borderColor:'#2563EB',
              backgroundColor:'rgba(37,99,235,0.07)',
              fill:true, tension:0.35,
              pointRadius: pData.map((p,i)=> notes[i] ? 7 : 4),
              pointBackgroundColor: pData.map((p,i)=> notes[i] ? '#B83500' : '#2563EB'),
              pointBorderColor:'white',
              pointBorderWidth:2,
            },
            {
              label:'Objectif marathon (5:30)',
              data: targetLine,
              borderColor:'#E8521A',
              borderDash:[5,4],
              borderWidth:1.5,
              pointRadius:0,
              fill:false,
            }
          ]
        },
        options: {
          responsive:true,
          plugins:{
            legend:{
              display:true,
              labels:{font:{size:10}, boxWidth:14, padding:10}
            },
            tooltip:{
              callbacks:{
                label: (ctx) => {
                  if (ctx.datasetIndex===1) return 'Objectif: 5:30/km';
                  const v=ctx.raw; if(!v) return '';
                  const m=Math.floor(v), s=Math.round((v-m)*60);
                  return `Allure: ${m}:${String(s).padStart(2,'0')}/km`;
                },
                afterLabel:(ctx)=> ctx.datasetIndex===0 && notes[ctx.dataIndex] ? notes[ctx.dataIndex] : ''
              }
            }
          },
          scales:{
            y:{
              reverse:true, beginAtZero:false,
              suggestedMin:4.5, suggestedMax:7.0,
              grid:{color:'#F0F0F0'},
              ticks:{
                font:{size:10},
                callback(v){
                  const m=Math.floor(v),s=Math.round((v-m)*60);
                  return `${m}:${String(s).padStart(2,'0')}`;
                }
              }
            },
            x:{grid:{display:false}, ticks:{font:{size:10}}}
          }
        }
      });
    }
  }, 50);
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  rerenderCurrentTab();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

const AUTH_KEY = 'coach-running-authed';

function isAppAuthed() {
  return localStorage.getItem(AUTH_KEY) === '1';
}

  document.body.innerHTML = `

            <path d="M7 13l2.5-4.6 4.2 1.2L17 6"/>
            <path d="M10 8.4l2.2 4.5-2 3.6"/>
            <path d="M14 9.7l2.4 4.8"/>
          </svg>
        </div>
        <div style="font-size:1.3rem;font-weight:850;letter-spacing:-0.3px;margin-bottom:4px">Coach Running</div>
        <div style="color:#888;font-size:0.85rem;margin-bottom:26px">Porto Marathon 2026 · espace privé</div>
        <input type="password" id="pwd-input" placeholder="Mot de passe" autocomplete="current-password"
          style="width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #E5E0D8;background:#FBF9F5;border-radius:10px;font-size:1rem;margin-bottom:12px;outline:none" />
        <button id="pwd-submit" type="submit"
          style="width:100%;padding:12px;background:linear-gradient(135deg,#E8521A,#A9350B);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 10px 20px rgba(232,82,26,0.18)">
          Accéder
        </button>
        <div id="pwd-error" style="color:#DC2626;font-size:0.85rem;margin-top:10px;min-height:18px"></div>
      </form>
    </div>`;
  setTimeout(() => document.getElementById('pwd-input')?.focus(), 100);
}

async function checkPassword() {
  const input = document.getElementById('pwd-input');
  const errEl = document.getElementById('pwd-error');
  const btn = document.getElementById('pwd-submit');
  const pwd = input?.value || '';
  if (!pwd) return;

  if (btn) { btn.disabled = true; btn.textContent = 'Vérification…'; }
  try {
    const r = await fetch('/api/auth-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    });
    const data = await r.json();
    if (data.ok) {
      localStorage.setItem(AUTH_KEY, '1');
      location.reload();
    } else {
      if (errEl) errEl.textContent = 'Mot de passe incorrect.';
      if (input) { input.value = ''; input.focus(); }
    }
  } catch {
    if (errEl) errEl.textContent = 'Erreur réseau, réessaie.';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Accéder'; }
  }
}

// ─── DÉMARRAGE ───────────────────────────────────────────────
if (!isAppAuthed()) {
  showLoginScreen();
} else {
  handleOAuthCallback();   // capture les tokens si retour OAuth
  refreshHeader();
  setInterval(refreshHeader, 60000);
  renderDashboard();
  if (isStravaConnected()) {
    syncStrava();
  }
}
